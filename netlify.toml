[build]
  command = "export NODE_OPTIONS=--openssl-legacy-provider && cd gulp && yarn install && touch ../src/js/core/config.local.js && yarn gulp build.web-localhost && cd ../build && HASH=$(git rev-parse --short=7 HEAD) && mkdir -p v/$HASH && cp -r * v/$HASH/ 2>/dev/null || true"
  publish = "build"
